# KairoPro local dev stack. The root .env DATABASE_URL points at this
# instance: postgresql://kairopro:kairopro@localhost:5432/kairopro_dev
#
# Integration tests use a throwaway database (kairopro_test) on the same
# engine — never the dev one. POSTGRES_USER is the container superuser, so
# Prisma can create the shadow database during `prisma migrate dev`.
name: kairopro

services:
  postgres:
    image: postgres:18-alpine
    container_name: kairopro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairopro
      POSTGRES_PASSWORD: kairopro
      POSTGRES_DB: kairopro_dev
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ requires the mount at /var/lib/postgresql — data lands
      # in a major-version subdirectory, enabling in-place pg_upgrade later.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairopro -d kairopro_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
